<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ DOM Magic ✨</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="glass-card">
        <h1 id="main-title">✨ DOM Manipulation Magic ✨</h1>
        <p>Change content, styles, and structure dynamically!</p>
    </header>
    
    <main>
        <!-- Task 1: Change Text -->
        <section class="card">
            <h2>🔤 Text Changer</h2>
            <p id="dynamic-text">Click the button to transform me!</p>
            <button id="change-text-btn" class="btn">Transform Text ✨</button>
        </section>

        <!-- Task 2: Style Modifier -->
        <section class="card">
            <h2>🎨 Style Artist</h2>
            <div id="style-demo" class="box">I'm a plain box... for now!</div>
            <button id="change-style-btn" class="btn">Make Me Fancy! 🎩</button>
        </section>

        <!-- Task 3: Element Toggler -->
        <section class="card">
            <h2>➕➖ Element Toggler</h2>
            <div id="element-container">
                <p>I'm the original element.</p>
            </div>
            <button id="toggle-element-btn" class="btn">Toggle Magic Element ✨</button>
        </section>
    </main>

    <footer class="glass-card">
        <p>Made with ❤️ & JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
